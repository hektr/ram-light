<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --good: #10b981;
      --warning: #f59e0b;
      --critical: #ef4444;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --radius: 8px;
    }

    body {
      width: 260px;
      padding: 20px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      text-align: center;
    }

    .ram-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .ram-value {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 12px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      transition: color 0.3s ease;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #f1f5f9;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s ease;
      box-shadow: 0 0 8px rgba(0,0,0,0.1); 
    }

    .total-info {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .action-btn {
      width: 100%;
      padding: 10px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(59, 130, 246, 0.2);
    }

    .action-btn:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
    }

    .action-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .action-btn:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 500;
      min-height: 20px;
      transition: color 0.2s;
    }

    .divider {
      height: 1px;
      background-color: var(--border);
      margin: 24px 0 16px 0;
    }

    .support-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px;
      background-color: transparent;
      color: var(--text-secondary);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .support-link:hover {
      background-color: #fff7ed;
      color: #ea580c;
      border-color: #fdba74;
      border-style: solid;
      transform: translateY(-1px);
    }

    .support-link svg {
      margin-right: 8px;
      transition: transform 0.2s ease;
    }

    .support-link:hover svg {
      transform: scale(1.1);
      fill: #ffedd5;
    }
  </style>
</head>
<body>
  <div class="ram-label">Free RAM</div>
  <div class="ram-value" id="ramValue">Loading...</div>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
  </div>
  
  <div class="total-info" id="totalRam">Total: —</div>
  
  <button class="action-btn" id="freeRamBtn">Discard inactive tabs</button>
  <div class="status" id="actionStatus"></div>
  
  <div class="divider"></div>
  <a href="https://boosty.to/hektr992" target="_blank" rel="noopener noreferrer" class="support-link">
    Support the developer
  </a>
  
  <script src="popup.js"></script>
</body>
</html>
